name: FractalCTF
version: '${version}'
main: com.sasha.ctf.FractalCTF
api-version: '1.21'
author: Sasha Wildfang
softdepend: [LuckPerms, FractalRanks]
description: '${description}'

commands:
  kit:
    description: Pick your kit (used from your next respawn).
    aliases: [kits, class]
  vote:
    description: Vote for the next map.
  join:
    description: Join the match that's being played (hub).
  leave:
    description: Leave the match and go back to the CTF hub.
  ctfstats:
    description: Your Capture the Flag stats.
    aliases: [stats]
  t:
    description: Send a message to your team only.
    aliases: [teamchat]
  tc:
    description: Turn team chat on or off.
  coins:
    description: How many coins you have.
  ctf:
    description: Admin commands for Capture the Flag.
    permission: ctf.admin
  ctfmap:
    description: Set up Capture the Flag maps (game server).
    permission: ctf.admin

permissions:
  ctf.admin:
    description: /ctf admin commands and the map editor.
    default: op
  ctf.kit.ingame:
    description: Change kit with /kit during a match (everyone else picks in the hub).
    default: op
  ctf.hub.stay:
    description: Stay in the hub instead of being sent into a match that's on.
    default: false
