name: FractalCTF
version: "1.22.0"
main: com.sasha.ctf.FractalCTF
api-version: '1.21'
author: Sasha Wildfang
softdepend: [LuckPerms, FractalRanks]
description: '${description}'

commands:
  kit:
    description: Pick your kit (used from your next respawn).
    aliases: [kits, class]
  vote:
    description: Vote for the next map.
  join:
    description: Join the match that's being played (hub).
  leave:
    description: Leave the match and go back to the CTF hub.
  ctfstats:
    description: Your Capture the Flag stats.
    aliases: [stats]
  t:
    description: Send a message to your team only.
    aliases: [teamchat]
  tc:
    description: Turn team chat on or off.
  coins:
    description: How many coins you have.
  rate:
    description: Rate the map of your last match, 1 to 5 stars.
  spectate:
    description: Watch the match without playing (again to join a team).
    aliases: [spec, watch]
  match:
    description: "Staff: /match pause, resume, end or start."
  pausematch:
    description: "Staff: pause the match."
  resumematch:
    description: "Staff: resume the match."
  endmatch:
    description: "Staff: end the match with no winner."
  ctf:
    description: Admin commands for Capture the Flag.
    permission: ctf.admin
  ctfmap:
    description: Set up Capture the Flag maps (game server).
    permission: ctf.admin
  editlobby:
    description: "Admin (hub): lobby edit mode on or off. On: creative, building allowed. Off: saves."
    permission: ctf.admin
  savelobby:
    description: "Admin (hub): save the lobby while in edit mode (it becomes what /regenlobby restores)."
    permission: ctf.admin
  regenlobby:
    description: "Admin (hub): rebuild the lobby from the last save, or /regenlobby original from the uploaded template."
    permission: ctf.admin
  coinsadmin:
    description: "Admin and the store: /coinsadmin add|remove|set|reset <player> [amount]."
    aliases: [coinadmin]
    permission: ctf.admin
  fly:
    description: Fly in the CTF lobby (a rank perk).
  quests:
    description: "Your daily, weekly and monthly quests and today's challenges. Staff: /quests setnpc puts the Quest Master here (hub)."
    aliases: [quest, challenges]
  coinbooster:
    description: "The coin booster that is running. Staff and the store: /coinbooster add <player> [minutes] [multiplier], /coinbooster clear."
    aliases: [booster, coinboost]
  pickteam:
    description: "In a match: the team menu (Auto Select for everyone; picking a team is a rank perk). /jointeam [auto|red|blue|yellow|green]."
    aliases: [team, jointeam]
  spawn:
    description: "In a match: back to your base after standing still for 10 seconds. In the lobby: the lobby's spawn."
    aliases: [base]
  previewkit:
    description: "See what's in a kit: /previewkit [kit]."
    aliases: [kitpreview]
  setmap:
    description: "Staff, in the CTF lobby: /setmap <map> [mode] sets the next map and ends the vote now; /setmap off lets the vote decide."
    permission: ctf.admin
  endvoting:
    description: "Staff, in the CTF lobby: end the map vote now (the gate opens and the countdown starts)."
    permission: ctf.admin
  hints:
    description: Turn the tips in chat off or back on.
    aliases: [tips]
  mutechat:
    description: "Staff: stop everyone without ctf.chat.staff from chatting. /mutechat [reason]"
    permission: ctf.chat.staff
  unmutechat:
    description: "Staff: open chat again after /mutechat."
    permission: ctf.chat.staff
  slowchat:
    description: "Staff: /slowchat <seconds> lets each player send one message every so often; /slowchat off."
    aliases: [slowmode]
    permission: ctf.chat.staff
  clearchat:
    description: "Staff: clear chat for everyone (staff keep theirs)."
    aliases: [cc]
    permission: ctf.chat.staff
  chatfilter:
    description: "Staff: /chatfilter add|remove <censor|block> <word>, list, test <message>, reload."
    permission: ctf.chat.staff

permissions:
  ctf.*:
    description: Everything in FractalCTF (admin commands, map editor, in-game kit changes, every rank perk).
    default: op
    children:
      ctf.admin: true
      ctf.kit.ingame: true
      ctf.rank.king: true
      ctf.chat.staff: true
      ctf.chat.links: true
      ctf.spectate.hidden: true
  # ── Rank perks: give each rank group its one line, e.g. /lp group guardian permission set ctf.rank.guardian true ──
  ctf.rank.guardian:
    description: "Guardian's CTF perks: /spectate, joining full lobbies, no chat cooldown, /fly in the lobby, keeping your kit."
    default: op
    children:
      ctf.spectate: true
      ctf.joinfull: true
      ctf.chat.nocooldown: true
      ctf.fly: true
      ctf.keepkit: true
  ctf.rank.champion:
    description: "Champion's CTF perks: Guardian's, and picking your team, /kit during a match, the kit layout editor, changing your vote."
    default: op
    children:
      ctf.rank.guardian: true
      ctf.pickteam: true
      ctf.kit.ingame: true
      ctf.kiteditor: true
      ctf.vote.change: true
  ctf.rank.warlord:
    description: "Warlord's CTF perks: Champion's, and quests accepted for you (when quests arrive)."
    default: op
    children:
      ctf.rank.champion: true
      ctf.quests.autoaccept: true
  ctf.rank.titan:
    description: "Titan's CTF perks: Warlord's (more to come)."
    default: op
    children:
      ctf.rank.warlord: true
  ctf.rank.king:
    description: "King's CTF perks: Titan's (more to come)."
    default: op
    children:
      ctf.rank.titan: true
  ctf.spectate:
    description: /spectate, to watch a match without playing.
    default: op
  ctf.chat.nocooldown:
    description: No wait between chat messages.
    default: op
  ctf.fly:
    description: /fly in the CTF lobby.
    default: op
  ctf.pickteam:
    description: Pick your team before a match.
    default: op
  ctf.kiteditor:
    description: The kit layout editor (shift-click a kit you own in the lobby).
    default: op
  ctf.vote.change:
    description: Change your vote after voting.
    default: op
  ctf.quests.autoaccept:
    description: Quests are accepted for you (kept for when quests arrive).
    default: op
  ctf.joinfull:
    description: Join even when the server is at max-players (donors and staff).
    default: op
  ctf.keepkit:
    description: Keep the chosen kit from one match to the next (donors). Without it the choice is cleared after every match.
    default: op
  ctf.admin:
    description: /ctf admin commands and the map editor.
    default: op
  ctf.spectate.hidden:
    description: "Watching a match, you're hidden from players and from other spectators (only others with this see you, and you're not in the tab list). For staff checking on cheaters."
    default: op
  ctf.chat.staff:
    description: "Chat moderation: /mutechat, /unmutechat, /slowchat, /clearchat, /chatfilter, filter alerts; never muted, slowed or cleared."
    default: op
  ctf.chat.links:
    description: Post links and server addresses in chat.
    default: op
  ctf.chat.nofilter:
    description: Chat isn't run through the word filter.
    default: false
  ctf.kit.ingame:
    description: Change kit with /kit during a match (everyone else picks in the hub).
    default: op
  ctf.hub.stay:
    description: Stay in the hub instead of being sent into a match that's on.
    default: false
