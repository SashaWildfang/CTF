# ┌──────────────────────────────────────────────────────────────┐
# │                     FractalCTF: config.yml                   │
# │   Capture the Flag for Fractal Network. The same plugin runs │
# │   on CTF-Hub (mode: hub) and CTF-Game (mode: game).          │
# │       Built by Sasha Wildfang for Fractal Network.           │
# └──────────────────────────────────────────────────────────────┘

# Do not change. Used to upgrade this file in future versions.
config-version: 1

# "hub" on the waiting lobby (votes, kits, countdown), "game" on the server
# the matches are played on.
mode: hub

# ── Servers ─────────────────────────────────────────────────────
# Names in the proxy's velocity.toml. Players are moved between them.
servers:
  hub: ctf
  game: ctf-game
  # The network lobby (the hub's "Back to Lobby" item and /leave).
  lobby: lobby

# ── Database ────────────────────────────────────────────────────
# Both CTF servers MUST use the same MySQL database: the hub and the game
# server talk to each other through it, and stats and kit choices live in it.
# Create one in the panel (CTF-Hub > Databases) and copy the details here
# on both servers.
database:
  host: "172.18.0.1"
  port: 3306
  name: ""
  user: ""
  password: ""
  # Prefix for the tables (ctf_match, ctf_maps, ctf_kits, ctf_stats).
  table-prefix: "ctf_"

# ── Hub ─────────────────────────────────────────────────────────
# Most players allowed on this server; players with ctf.joinfull (donors, staff) can always join.
max-players: 100
# Keep it daytime with clear weather in every world.
always-day: true

hub:
  # The countdown starts once this many players are in the hub.
  min-players: 2
  # With this many in the hub (or once everyone has voted), the countdown
  # drops to short-countdown-seconds.
  max-players: 24
  countdown-seconds: 60
  short-countdown-seconds: 10
  # Map choices in each vote.
  vote-options: 3
  # Where players stand in the hub. "auto" = in front of the FRACTAL CTF title
  # of the hub that ships with the plugin. Or set it in game with /ctf sethubspawn.
  spawn: "auto"
  # Falling below this height sends players back to the spawn.
  void-y: 30
  # The names over the hub's characters are floating text. How far above their feet the name sits
  # (a plain name tag sits at 2.45), and whether to draw the dark box behind it and the hint under it.
  npc-name-height: 2.6
  npc-name-background: false
  # The hub's characters turn to players, glance about and nod either way. With this on, the ones given a
  # beat in hub-npcs.yml (pace: "x z; x z") also stroll it while nobody is near; false keeps them on their spots.
  npc-movement: true
  # How often the Top 10 boards re-read the leaderboards (seconds, 10 at least).
  board-refresh-seconds: 30
  # A character with several lines says them one after another, leaving time to read each: a pause that grows
  # with the line's length (about 2.5 to 6.5 seconds). A number above 0 makes every pause that many seconds.
  # Clicking the character again while it talks brings the next line at once.
  npc-line-pause-seconds: 0
  # Right-click a wooden stair with an empty hand to sit on it (sneak to stand up).
  sit-on-stairs: true
  # How a match starts: once min-players are here the vote opens. It closes gate-countdown-seconds before the end
  # of countdown-seconds (or as soon as quick-start-fraction of the lobby has voted): the result is announced, the
  # map loads, the Match Gate opens and the last gate-countdown-seconds count down. Chat says "starts in" at the
  # seconds in countdown-warnings. (vote-lock-seconds and gate-seconds from before 1.15.0 are no longer used.)
  gate-countdown-seconds: 5
  countdown-warnings: [5, 4, 3, 2, 1]
  # The Match Gate breaks open when the vote closes and you can walk through it into the match.
  portal-opens: true
  # What breaks open: only the portal's own blocks, never the arch round it. Empty = glass (stained, tinted, panes),
  # amethyst and froglights. List block names here to choose them yourself, e.g. [purple_stained_glass, amethyst_block].
  portal-blocks: []
  # As soon as everyone (or quick-start-fraction) in the lobby has voted, the vote closes and the gate opens.
  open-when-all-voted: true
  # true: someone who arrives in the lobby while a match is on is sent straight into it. false: they stay in the
  # lobby and join through the gate, the Join item or /join when they want to.
  auto-join-running-match: false
  # The floating labels come from "labels:" in hub-npcs.yml (so a new file changes them without a new world).
  # false: the labels saved in the lobby world are left as they are.
  labels-from-file: true
  # After a match, the next one cannot start for this many seconds (time to vote and pick a kit).
  after-match-seconds: 45
  # Once this share of the lobby has voted, the vote closes and the gate opens (no wait for the rest).
  quick-start-fraction: 0.67

# ── Game ────────────────────────────────────────────────────────
game:
  # Seconds everyone flies around to look at the map before the match starts
  # (kits are handed out when it starts).
  start-countdown-seconds: 15
  # Chests, barrels, furnaces, hoppers, shulker boxes, ender chests, chest boats and decorated pots on the maps
  # can't be opened or filled by players (creative is let through).
  lock-containers: true
  # A match never ends because players left: with fewer than two teams on, it carries on, but nothing can be
  # scored and no coins are earned until another team has players. A match that never had two teams on for
  # min-contested-seconds pays no play/win coins and doesn't count as a game.
  min-contested-seconds: 60
  # Players can break the map itself, except this close to a spawn or a flag/wool/beacon.
  break-map-blocks: true
  spawn-protect-radius: 6
  objective-protect-radius: 4
  # A bow kill from this far is a long shot.
  long-shot-blocks: 30
  # Golden apples for every kill, and the cooldown after eating one (no chugging).
  kill-golden-apples: 1
  golden-apple-cooldown-seconds: 10
  # 1.8-style combat: no attack cooldown and no sweeping.
  legacy-combat: true
  # Longest wait for the players the hub sent, before starting with whoever
  # is there.
  join-wait-seconds: 20
  # Seconds a player can't be hurt after (re)spawning. They also stay safe while
  # they're still in their spawn (spawn-protect-radius), for up to 20 seconds,
  # so nobody can camp a spawn. Attacking ends it.
  spawn-protection-seconds: 3
  # Seconds the dead watch the match (invisible, flying) before they respawn.
  respawn-seconds: 5
  # Slowness for whoever breaks a wool, so a monument can't fall in a second.
  wool-break-slowness-seconds: 4
  # A dropped flag goes home by itself after this long.
  flag-return-seconds: 30
  # A fall, the void or fire within this many seconds of being hurt by an enemy (a hit, an arrow, a turret,
  # TNT, undead...) counts as that enemy's kill.
  kill-credit-seconds: 20
  # King of the Hill: the point nearest the middle of the map scores this many points a second (the others 1).
  koth-middle-points: 2
  # King of the Hill: each extra holder standing on a point adds this much to what it scores (0.25 = +25%, at most double).
  koth-crowd-bonus: 0.25
  # A half-finished capture nobody is standing on fades by this share of the capture time each second.
  koth-decay-per-second: 0.05
  # Holding a hill needs presence. Owners on it: full points (more with more of them). Nobody from the owning
  # team on it: koth-away-rate of that (0.5 = half) for koth-grace-seconds, then nothing while the hold drains
  # back to neutral over koth-neutralize-seconds (stepping back on refills it).
  koth-away-rate: 0.5
  koth-grace-seconds: 8
  koth-neutralize-seconds: 10
  # Who counts as on a hill: its area plus this many blocks round it, and a bit below/above it.
  koth-zone-margin: 1.5
  koth-zone-below: 1
  koth-zone-above: 2
  # Destroy the Wool: wool to break to knock a team out (0 = all of it), and the Mining Fatigue level it gives.
  wool-to-break: 10
  wool-mining-fatigue: 1
  # /spawn in a match: seconds of standing still before you're back at base (the same as a respawn).
  return-to-base-seconds: 5
  # When a team is two or more players short (someone went to spectate or left), a player moves over.
  auto-balance: true
  # CTF: a thin beam of the team's colour rises from each flag (and from whoever carries it), seen across the map.
  flag-beam: true
  flag-beam-height: 48
  # CTF: the dots on the locator bar (over the XP bar) point to the flags, in their team's colour, not to players.
  flag-locator: true
  # A capture shoots fireworks this high (0 = burst on the spot, 1-3 = higher each step) and this many of them.
  capture-firework-power: 2
  capture-firework-count: 3
  # Seconds between the end of a match and everyone going back to the hub.
  return-to-lobby-seconds: 20
  # Players may break blocks within this many blocks of a spawn, flag stand
  # or wool only if they placed them; nobody can place blocks this close.
  protected-radius: 3
  # Where nobody (either team) may place or break blocks: a cylinder round each team's spawn point
  # (this radius, from 3 below to 7 above it), round each flag stand, round each wool tower, and on the hills.
  build:
    spawn-radius: 6
    flag-radius: 3
    wool-radius: 2
  # Warm-up: when the match starts with only one team, the clock waits; when another team arrives
  # everyone gets this many seconds, then goes back to their spawn with a fresh kit.
  warmup-get-ready-seconds: 5

# ── Kits and coins ──────────────────────────────────────────────
kits:
  # Ticks before a thrown TNT goes off (20 = a second).
  tnt-fuse-ticks: 60
  # How close an enemy must be before the Necromancer's undead go after them (they stand still otherwise).
  undead-range: 10
  # Hits it takes to destroy an Engineer's turret (shown as hearts over it).
  turret-hits: 5
  # Seeking Archer: an arrow curves only onto an enemy the archer could see when shooting, within seek-lock-range
  # blocks of the arrow with no wall between, and only for its first seek-max-flight blocks (no long-range
  # snipes on players out of sight). seek-turn-degrees: how sharply it can turn each tick.
  seek-lock-range: 12
  seek-max-flight: 32
  seek-turn-degrees: 9
  # The kit new players start with (must be free).
  default: barbarian
  # Coins to unlock each kit (0 = free for everyone).
  prices:
    barbarian: 0
    medic: 0
    shielder: 0
    fire_archer: 0
    builder: 500
    choruser: 500
    infiltrator: 500
    ninja: 500
    big_spender: 1000
    demoman: 1000
    seeking_archer: 1000
    spy: 1000
    tank: 1000
    engineer: 1500
    necromancer: 1500
    phoenix: 1500
    redstone_mechanic: 1500
    sheep_farmer: 1500
    thor: 1500

coins:
  kill: 2
  assist: 1
  # Capturing a flag or destroying a wool.
  objective: 5
  # Each player standing on the hill when their team scores 10 points.
  hill: 2
  win: 10
  # Everyone who finishes a match.
  play: 3
  # Seconds after hitting someone that you still get an assist if they die.
  assist-seconds: 10
  # The first kill of the match, on top of the kill's coins.
  first-blood: 3
  # King of the Hill: taking a point back from another team (on top of "hill"), and holding a point:
  # hill-hold coins for every hill-hold-seconds you stand on a point your team owns.
  hill-retake: 2
  hill-hold: 1
  hill-hold-seconds: 15
  # Destroy the Wool: each wool block broken (a tower has 40).
  wool: 3
  # The first time a player rates a map with /rate.
  first-rating: 20
  # Destroying an enemy turret.
  turret: 2


# ── Chat ────────────────────────────────────────────────────────
chat:
  # false: chat is sent as plain server messages. That is what stops "Chat validation error" showing in place of
  # messages (Minecraft's signed chat fails its check after some server switches). true: Minecraft's signed chat.
  signed: false
  # Seconds between chat messages for players without a rank (ctf.chat.nocooldown never waits). 0 = no wait.
  cooldown-seconds: 3
  # (Slow mode, /slowchat, applies on top of this to everyone without ctf.chat.staff.)
  # Rank prefixes made of resource-pack glyphs show as empty boxes when the
  # player doesn't have the pack on this server. Turn this on to show these
  # text tags instead (keys are FractalRanks group names, lower case).
  use-group-tags: false
  group-tags:
    owner: "<dark_red><bold>OWNER</bold></dark_red> "
    admin: "<red><bold>ADMIN</bold></red> "
    mod: "<blue><bold>MOD</bold></blue> "
    default: ""

# ── Tab list ────────────────────────────────────────────────────
# The heads beside the team headings in a match: solid team-coloured skins (Mojang-signed, from MineSkin's public
# gallery; the client only shows signed skins). Leave these as they are.
tab:
  skins:
    red:
      value: ""
      signature: ""
    blue:
      value: ""
      signature: ""
    yellow:
      value: ""
      signature: ""
    green:
      value: ""
      signature: ""
    # the SPECTATORS heading: a solid white face
    spectators:
      value: ""
      signature: ""


# ── Chat moderation ─────────────────────────────────────────────
# The words themselves are in chat-filter.yml (/chatfilter). Staff commands:
# /mutechat [reason], /unmutechat, /slowchat <seconds|off>, /clearchat.
# Permissions: ctf.chat.staff (the commands, filter alerts, not muted/slowed/
# cleared), ctf.chat.links (may post links), ctf.chat.nofilter (not filtered).
# Muting players one by one is justBans' /mute.
chat-moderation:
  # Stop links and server IPs (anything in allowed-links is fine).
  block-links: true
  allowed-links:
    - fractalsmp.net
  # Seconds before the same message may be sent again (0 = off).
  repeat-seconds: 30
  # Messages mostly in capitals (at least caps-min-letters letters, more than
  # caps-max-percent of them capitals) are turned into lower case.
  anti-caps: true
  caps-min-letters: 8
  caps-max-percent: 70
  # "aaaaaaaa" / "!!!!!!!!" are cut down to this many (0 = off).
  max-repeated-characters: 4
  censor-character: "*"
  # Tell online staff when a message is stopped (it's always in the console).
  alert-staff: true


# ── Tips in chat ────────────────────────────────────────────────
# A tip or announcement every minutes-between, from the lists under hints:
# in messages.yml (hub: and game:). Never while the vote is closing, the
# gate is counting down, or a match is counting down / just started / over.
# Players turn them off with /hints.
hints:
  enabled: true
  minutes-between: 6
  # Tips are broken into lines this many pixels wide (the default chat is 320), with even lines and a command
  # never split from what comes after it.
  line-width: 290
  # Played with each tip (any sound key, also a resource-pack one like fractal:...). "" = silent.
  sound: "block.amethyst_block.chime"
  sound-volume: 0.8
  sound-pitch: 1.5
