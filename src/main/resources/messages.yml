# ── Tips in chat (config.yml hints:) ────────────────────────────
# One line each, picked in a shuffled order. <hint> in format is the tip itself.
hints:
  # A blank line, a header, the tip, a blank line. <hint> is the tip itself.
  format: "\n<gradient:#B58CFF:#5599FF><bold>  ✦ DID YOU KNOW?</bold></gradient>\n<#D9D0F5>  <hint>\n"
  turned-off: "<prefix><#D9D0F5>Tips are off. <white>/hints</white> turns them back on."
  turned-on: "<prefix><green>Tips are back on."
  hub:
    - "Pick your kit before the match: open the <white>book</white> or visit the <white>Armoury</white>."
    - "Shift + Right-Click a kit in the kit menu to move its items where you like them."
    - "Every kit has its own ability. Read it in the kit menu before you pick."
    - "Vote with the <white>paper</white> when voting opens. Two thirds voting ends the vote early."
    - "Walk through the <light_purple>Match Gate</light_purple> to get into a match sooner."
    - "A match already on? Type <yellow>/join</yellow> and pick a team when you get there."
    - "<yellow>/stats</yellow> shows your stats, every leaderboard and every player's numbers."
    - "Punch the <white>Top Objectives</white> board to switch between flags, wool and hills."
    - "Coins buy kits. Earn them for kills, objectives and wins, or get more at <aqua><click:open_url:'https://store.fractalsmp.net'>store.fractalsmp.net</click></aqua>."
    - "Ranks can pick their team, change kit mid-match and skip the chat cooldown: <aqua><click:open_url:'https://store.fractalsmp.net'>store.fractalsmp.net</click></aqua>."
    - "A coin booster doubles coins for everyone on CTF for an hour. Say thanks in chat!"
    - "Join our Discord for updates, events and giveaways: <aqua><click:open_url:'https://dc.fractalsmp.net'>dc.fractalsmp.net</click></aqua>."
    - "Rate the last map with <yellow>/rate 1-5</yellow>: your first rating gives you 20 coins."
    - "Don't want these tips? <yellow>/hints</yellow> turns them off."
  game:
    - "<yellow>/tc</yellow> sends everything you type to your team only. <yellow>/t <message></yellow> for one message."
    - "<yellow>/spawn</yellow> takes you back to base after 5 seconds standing still."
    - "Your own flag has to be at base before you can score a capture."
    - "Assists earn coins too: hit someone before a teammate finishes them."
    - "First blood gives bonus coins. Be quick!"
    - "Standing on a hill with teammates captures it faster."
    - "Breaking enemy wool gives you Mining Fatigue for a moment. Watch your back."
    - "Ranks can change kit during a match with <yellow>/kit</yellow>: <aqua><click:open_url:'https://store.fractalsmp.net'>store.fractalsmp.net</click></aqua>."
    - "Join our Discord for updates, events and giveaways: <aqua><click:open_url:'https://dc.fractalsmp.net'>dc.fractalsmp.net</click></aqua>."
    - "Don't want these tips? <yellow>/hints</yellow> turns them off."
