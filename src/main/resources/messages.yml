# ── Admin ───────────────────────────────────────────────────────
admin:
  help:
    - "<prefix><white>/ctf start</white> <#D9D0F5>start the countdown now (hub)"
    - "<prefix><white>/ctf end</white> <#D9D0F5>end the match with no winner (hub or game)"
    - "<prefix><white>/ctf pause</white> <#D9D0F5>/ <white>resume</white> <#D9D0F5>pause the match (or the lobby countdown)"
    - "<prefix><white>/match pause|resume|end</white> <#D9D0F5>also /pausematch, /resumematch, /endmatch"
