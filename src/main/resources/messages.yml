    assist: "<gray>Assist on </gray><victim>"
    capture: "<gray>Captured </gray><team><gray>'s Flag"
    wool: "<gray>Destroyed </gray><team><gray> Wool"
    hill: "<gray>Holding the Hill"
    win: "<gray>won the match"
    play: "<gray>played the match"
