  back: "<gray>Back"
  back-lore: ["<dark_gray>Leave without saving."]
  reset: "<yellow><bold>Reset"
  reset-lore: ["<gray>Back to the default layout."]
  save: "<green><bold>Save"
  save-lore: ["<gray>Use this layout from now on.", "<dark_gray>Top three rows: inventory.", "<dark_gray>Fourth row: your hotbar."]

ability:
