  back: "<gray>Back"
  free: "<green>Free"
  preview: "<aqua><bold>Preview"
  preview-lore: ["<gray>See what this kit comes with."]
  preview-title: "<dark_gray>Preview: <kit>"
  disabled: "<prefix><red><kit> is turned off right now."
  disabled-lore: "<dark_gray>Turned off by staff"
