# ── Hub characters ──────────────────────────────────────────────
npc:
  says: "<name> <#9C8DC8>»</#9C8DC8> <white><line>"
  click-hint: "<#D9D0F5>Click to talk"
  # A team's soldier sometimes ends what it says on one of these: a shot at the other three teams
  # (characters whose id in hub-npcs.yml starts red-, blue-, yellow- or green-)
  trash-talk-red:
    - "Blue team? I've seen scarier sheep."
    - "Blue builds bridges like they're scared of heights. Because they are."
    - "Tell Captain Hale his flag looks better on our pole."
    - "Blue's idea of defence is standing near the wool and hoping."
    - "We don't camp their spawn. We just wait politely outside it."
    - "Last match Blue lost their wool so fast the tower didn't notice."
    - "The Bastion polish their armour before a match. We dent it for them after."
    - "The Enclave apologise to the grass before they lose on it."
    - "Three teams signed the Accord for peace. We signed it for the rematch."
  trash-talk-blue:
    - "Red? They charge in like the void isn't there. It usually is."
    - "Red's strategy: run at the flag, fall off, repeat."
    - "Captain Ashby calls it a war hall. I call it a lost-and-found."
    - "If Red spent half as long bridging as shouting, they'd win once."
    - "Red's archers couldn't hit a beacon from inside the beam."
    - "Their tents are red so nobody sees them blushing after a loss."
    - "The Bastion count their coins twice and their flags never. Saves time."
    - "The Enclave hide in the leaves. We chart the leaves."
    - "Four teams on one rock, and somehow only ours can read a map."
  trash-talk-yellow:
    - "Crimson hit hard. They also hit the void, the wall and each other."
    - "Cobalt plan a match for an hour and lose it in a minute."
    - "The Enclave would defend their wool better if they stopped watering it."
    - "We held the gate when the Citadel fell. The other three held the door on their way out."
    - "Gold does not rust, run or drop the flag. We could learn less from it."
    - "Marshal Sterling keeps a ledger of every flag owed to us. It is a long ledger."
    - "Red and Blue have been arguing over one flag since the Accord. We took four while they shouted."
    - "A Bastion soldier never retreats. We advance toward the treasury."
  trash-talk-green:
    - "Crimson burn everything they cannot hit. They burn a lot."
    - "Cobalt measure the wind. We just ask the trees."
    - "The Bastion's hall is very shiny. So is bait."
    - "Three teams built walls. We grew ours, and ours bite."
    - "Step on the moss in a match and you will find out why it is so soft."
    - "Red charge, Blue plan, Yellow count. We wait. Guess who is still standing."
    - "Elder Greenwood has outlived six captains from each of the other teams. She keeps a list."
    - "They call us gardeners. Gardeners know where everything is buried."
  kit-price: "<gold><price> Coins"
  kit-free: "<green>Free"
  kit-owned: "<yellow>✔ Unlocked"
  kit-selected: "<green>✔ Equipped"

