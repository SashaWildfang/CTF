# ── Chat and tab list ───────────────────────────────────────────
chat:
  # <rank> is the FractalRanks prefix and <rankcolor> its colour; in a match <tag> is R/B/G/Y and <color> the team colour.
  name: "<rank><rankcolor><player>"
  name-team: "<color><bold><tag></bold></color> <rank><color><player>"
  # In a match: the rank, then the name in the team colour
  name-in-team: "<rank><color><player>"
  # <seconds>: how long until they may chat again (chat.cooldown-seconds in config.yml; ranks with ctf.chat.nocooldown never wait)
  cooldown: "<prefix><#D9D0F5>You can chat again in <white><seconds>s</white>."
  format: "<name> <#9C8DC8>»</#9C8DC8> <white><message>"
  team-format: "<color><bold>[TEAM]</bold></color> <name> <#9C8DC8>»</#9C8DC8> <color><message>"
  team-on: "<prefix><green>Team chat on.</green> <#D9D0F5>Everything you type goes to your team. /tc to turn it off."
  team-off: "<prefix><#D9D0F5>Team chat off."
  no-team: "<prefix><red>You're not on a team right now."
  # ── Chat moderation (chat-moderation in config.yml, words in chat-filter.yml) ──
  muted: "<prefix><red>Chat is muted right now."
  muted-reason: "<prefix><red>Chat is muted: <white><reason>"
  slow: "<prefix><#D9D0F5>Slow mode is on (<white><slow>s</white>): you can chat again in <white><seconds>s</white>."
  blocked: "<prefix><red>That message wasn't sent: it has a word that isn't allowed here."
  no-links: "<prefix><red>Links and server addresses aren't allowed in chat."
  repeat: "<prefix><red>Please don't send the same message again."
  staff-alert: "<dark_gray>[<red>Filter</red>]</dark_gray> <white><player></white> <gray>(<why>)</gray><dark_gray>:</dark_gray> <gray><message>"
  mute-on: "<prefix><red><bold>Chat has been muted</bold></red> <#D9D0F5>by <white><player></white>."
  mute-on-reason: "<prefix><red><bold>Chat has been muted</bold></red> <#D9D0F5>by <white><player></white>: <white><reason>"
  mute-off: "<prefix><green><bold>Chat is open again.</bold></green> <#D9D0F5>(<white><player></white>)"
  slow-on: "<prefix><yellow><bold>Slow mode on:</bold></yellow> <#D9D0F5>one message every <white><seconds>s</white>. (<white><player></white>)"
  slow-off: "<prefix><green>Slow mode off.</green> <#D9D0F5>(<white><player></white>)"
  cleared: "<prefix><#D9D0F5>Chat was cleared by <white><player></white>."
  cleared-staff: "<prefix><#D9D0F5>Chat was cleared by <white><player></white> <gray>(staff keep theirs)."
  already-muted: "<prefix><#D9D0F5>Chat is already muted. <white>/unmutechat</white> opens it."
  not-muted: "<prefix><#D9D0F5>Chat isn't muted."
  slow-usage: "<prefix><#D9D0F5>Usage: <white>/slowchat <seconds></white> or <white>/slowchat off</white>. Now: <white><now></white>"
  filter-usage: "<prefix><#D9D0F5>Usage: <white>/chatfilter <add|remove> <censor|block> <word></white>, <white>/chatfilter list <censor|block></white>, <white>/chatfilter test <message></white>, <white>/chatfilter reload</white>"
  filter-added: "<prefix><green>Added <white><word></white> to the <white><list></white> list."
  filter-removed: "<prefix><green>Removed <white><word></white> from the <white><list></white> list."
  filter-unchanged: "<prefix><#D9D0F5>Nothing changed (<white><word></white> already there, or not found)."
  filter-list: "<prefix><#D9D0F5><list> (<white><count></white>): <white><words>"
  filter-test: "<prefix><#D9D0F5>Would come out as: <white><result>"
  filter-reloaded: "<prefix><green>chat-filter.yml reloaded."

tab:
  hub-header: "\n<gradient:#FF5555:#5599FF><bold>FRACTAL CTF</bold></gradient>\n<#D9D0F5>Waiting lobby <#9C8DC8>• <white><players></white> online\n"
  hub-footer: "\n<yellow>/kit</yellow> <#D9D0F5>kits</#D9D0F5>  <#9C8DC8>•</#9C8DC8>  <yellow>/vote</yellow> <#D9D0F5>maps</#D9D0F5>  <#9C8DC8>•</#9C8DC8>  <yellow>/leave</yellow> <#D9D0F5>lobby</#D9D0F5>\n<#9C8DB8>fractalsmp.net\n"
  game-header: "\n<gradient:#FF5555:#5599FF><bold>FRACTAL CTF</bold></gradient>\n<#D9D0F5><mode>\n<white>Map: <yellow><map>\n<#D9D0F5>By <white><authors>\n"
  game-header-no-author: "\n<gradient:#FF5555:#5599FF><bold>FRACTAL CTF</bold></gradient>\n<#D9D0F5><mode>\n<white>Map: <yellow><map>\n"
  team-heading: "<bold><team></bold> <#9C8DC8>(<white><players></white>)"
  spectator-heading: "<#D9D0F5><bold>SPECTATORS</bold> <#9C8DC8>(<white><players></white>)"
  players-heading: "<gradient:#FF5555:#5599FF><bold>PLAYERS</bold></gradient> <#9C8DC8>(<white><players></white>)"
  more: "<#9C8DC8>+<players> more"
  # The right-hand column (one line per row, 20 rows at most). In a match, "<scores>" is the teams' score lines.
  info:
    game:
      - "<gold><bold>MATCH"
      - "<#D9D0F5>Map: <white><map>"
      - "<#D9D0F5>Mode: <white><mode>"
      - "<#D9D0F5>Time left: <white><time>"
