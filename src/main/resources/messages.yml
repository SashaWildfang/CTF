# ┌──────────────────────────────────────────────────────────────┐
# │                    FractalCTF: messages.yml                  │
# │   Everything players read. MiniMessage format; <prefix> is   │
# │   the CTF prefix. Missing lines come from the plugin's copy, │
# │   so new messages appear after an update by themselves.      │
# │       Built by Sasha Wildfang for Fractal Network.           │
# └──────────────────────────────────────────────────────────────┘

# Bumped when an update changes existing messages: the old file is then saved as messages-old.yml.
messages-version: 2

prefix: "<gradient:#FF5555:#5599FF><bold>CTF</bold></gradient> <dark_gray>»</dark_gray> "

general:
  players-only: "<prefix><red>Only players can do that."
  no-database: "<prefix><red>The CTF database isn't set up yet. <gray>(config.yml database:)"

