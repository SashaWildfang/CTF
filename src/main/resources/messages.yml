# ┌──────────────────────────────────────────────────────────────┐
# │                    FractalCTF: messages.yml                  │
# │   Everything players read. MiniMessage format; <prefix> is   │
# │   the CTF prefix. Missing lines come from the plugin's copy, │
# │   so new messages appear after an update by themselves.      │
# │       Built by Sasha Wildfang for Fractal Network.           │
# └──────────────────────────────────────────────────────────────┘

# Bumped when an update changes existing messages: the old file is then saved as messages-old.yml.
messages-version: 16

prefix: "<gradient:#FF5555:#5599FF><bold>CTF</bold></gradient> <#9C8DC8>»</#9C8DC8> "

general:
  no-permission: "<prefix><red>You don't have permission to do that."
  players-only: "<prefix><red>Only players can do that."
  no-database: "<prefix><red>The CTF database isn't set up yet. <#D9D0F5>(config.yml database:)"
  server-full: "<red><bold>Capture the Flag is full</bold> <#D9D0F5>(<max> players)\n<#D9D0F5>Donors can always join: <gold>store.fractalsmp.net"

# ── Hub ─────────────────────────────────────────────────────────
hub:
  paused: "<prefix><yellow>Staff paused the CTF lobby. New matches will start soon."
  resumed: "<prefix><green>The CTF lobby is back on!"
  countdown-started: "<prefix><#D9D0F5>Enough players! Vote for the next map with the <white>paper</white>."
  # The vote opens once there are enough players; it closes <seconds> later (or once two thirds have voted)
  voting-open: "<prefix><green>Voting is open!</green> <#D9D0F5>Pick a map with the <white>paper</white>. The vote closes in <white><seconds>s</white>."
  vote-closing: "<prefix><#D9D0F5>The vote closes in <yellow><seconds>s</yellow>. Get your vote in!"
  # Right after the result: the gate is open and the last seconds count down
  # Over the hotbar in the lobby while a match is on
  in-match-bar: "<green>Match in progress! <#D9D0F5>Join with <yellow>/join"
  gate-countdown: "<prefix><#D9D0F5>The <light_purple>Match Gate</light_purple> is open: walk through, or you're sent in <white><seconds>s</white>."
  countdown-cancelled: "<prefix><red>Not enough players: waiting for <white><needed></white> more."
  countdown-shortened: "<prefix><#D9D0F5>Everyone's ready: teleporting in <white><seconds>s</white>!"
  countdown: "<prefix><white>Teleporting to the match in <yellow><bold><seconds>s</bold></yellow>"
  spectating: "<prefix><aqua>Sending you to watch <white><map></white>..."
  vote-won: "<prefix><green>The votes are in!</green> <white><bold><map></bold></white> <#D9D0F5>(<white><mode></white>) wins with <white><votes></white> votes."
  vote-won-one: "<prefix><green>The votes are in!</green> <white><bold><map></bold></white> <#D9D0F5>(<white><mode></white>) wins with <white>1</white> vote."
  vote-won-none: "<prefix><#D9D0F5>Nobody voted, so it's <white><bold><map></bold></white> <#D9D0F5>(<white><mode></white>)."
  map-picked: "<prefix><#D9D0F5>Staff picked the next map: <white><bold><map></bold></white> <#D9D0F5>(<white><mode></white>)!"
  # /setmap: everyone sees who set it; the vote ends there
  map-set: "<prefix><white><player></white> <#D9D0F5>has set the next map to <white><bold><map></bold></white> <#D9D0F5>(<white><mode></white>)."
  vote-ended: "<prefix><white><player></white> <#D9D0F5>ended the vote."
  your-team: "<prefix><#D9D0F5>You're on the <team> <#D9D0F5>team."
  sending: "<prefix><green>Sending you to <white><map></white>..."
  joining: "<prefix><green>Joining the match on <white><map></white>..."
  gate-open: "<prefix><#D9D0F5>The <light_purple>Match Gate</light_purple> is open. Walk through it, or wait for the countdown."
  all-voted: "<prefix><green>The votes are in.</green> <#D9D0F5>Teleporting in <white><seconds>s</white>, or walk through the gate!"
  # Over every head in the lobby, under the name
  tag:
    kit: "<gray>Kit: <gold><kit>"
    kit-none: "<gray>Kit: <red>✖ None"
  no-match: "<prefix><red>There's no match to join right now."
  no-maps: "<prefix><red>There are no maps ready yet. <#D9D0F5>(Set them up on CTF-Game with /ctfmap.)"
  no-database: "<prefix><red>The CTF database isn't connected, so no match can start."
  game-busy: "<prefix><red>The game server is still busy with the last match. Trying again soon."
  game-not-responding: "<prefix><red>The game server didn't answer. Starting a new vote."
  sidebar:
    title: "<gradient:#FF5555:#5599FF><bold>CAPTURE THE FLAG</bold></gradient>"
    waiting: "<#D9D0F5>Waiting for players"
    countdown: "<#D9D0F5>Teleporting in <green><seconds>s"
    voting: "<#D9D0F5>Vote ends in <yellow><seconds>s"
    paused: "<yellow>Paused by staff"
    # Only seen if the map was not ready when the countdown ran out
    starting: "<green>Teleporting any second..."
    in-match: "<green>Match in progress"
    vote-header: "<white><bold>Vote"
    vote-line: "<#9C8DC8><number>.</#9C8DC8> <white><map> <yellow><votes>"
    vote-line-mine: "<#9C8DC8><number>.</#9C8DC8> <green><map> <yellow><votes></yellow> <green>✔"
    no-maps: "<red>No maps ready yet"
    match-map: "<#D9D0F5>Map: <white><map>"
    match-mode: "<#D9D0F5>Mode: <white><mode>"
    gate-open: "<light_purple>The gate is open"
    booster: "<light_purple><multiplier>x coins <#9C8DC8><minutes>m"
    kit: "<#D9D0F5>Kit: <gold><kit>"
    kit-none: "<#D9D0F5>Kit: <red>✖ None"
    coins: "<#D9D0F5>Coins: <gold><coins>"
    footer: "<#9C8DB8>fractalsmp.net"

items:
  kit-menu:
    name: "<gold><bold>Kit Selector</bold> <#D9D0F5>(Right Click)"
    lore: ["<#D9D0F5>Pick the kit you spawn with."]
  vote:
    name: "<white><bold>Map Vote</bold> <#D9D0F5>(Right Click)"
    lore: ["<#D9D0F5>Vote for the next map."]
  join:
    name: "<green><bold>Join Match</bold> <#D9D0F5>(Right Click)"
    lore: ["<#D9D0F5>Jump into the match that's on now."]
  stats:
    name: "<aqua><bold>Your Stats</bold> <#D9D0F5>(Right Click)"
    lore: ["<#D9D0F5>Kills, captures, wins and more."]
  lobby:
    name: "<red><bold>Back to Lobby</bold> <#D9D0F5>(Right Click)"
    lore: ["<#D9D0F5>Return to the Fractal lobby.", "<#9C8DC8>Takes 3 seconds; right-click again to stay."]

# ── Voting ──────────────────────────────────────────────────────
rate:
  prompt: "<prefix><white>Enjoyed <yellow><map></yellow>? Rate it with <yellow>/rate 1-5</yellow>."
  done: "<prefix><green>You rated <white><map></white> <gold><stars></gold><green>. <#D9D0F5>Rate it again any time to change it."
  nothing: "<prefix><#D9D0F5>Play a match first, then rate its map with /rate 1-5."
  first-coins: "<prefix><gold>+<coins> coins</gold> <#D9D0F5>for rating <white><map></white> for the first time!"

vote:
  menu-title: "<#9C8DC8>Vote for the next map"
  rating: "<#D9D0F5>Rating: <white><rating></white> <gold><stars></gold> <#9C8DC8>(<count>)"
  no-rating: "<#D9D0F5>Rating: <#9C8DC8>not rated yet"
  option-name: "<white><bold><number>. <map>"
  option-lore:
    - "<#D9D0F5>By <white><authors>"
    - "<#D9D0F5>Votes: <yellow><votes>"
    - ""
  click-to-vote: "<yellow>Click to vote"
  your-vote: "<green>✔ Your vote"
  voted: "<prefix><white>You voted for <yellow><map></yellow>."
  closed: "<prefix><red>Voting is closed right now."
  paused: "<prefix><yellow>The lobby is paused, so voting is closed for now."
  no-maps: "<prefix><red>There are no maps to vote for yet."
  usage: "<prefix><#D9D0F5>Use <white>/vote</white> or <white>/vote 1-3</white>."

