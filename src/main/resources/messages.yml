  regen-confirm-saved: "<prefix><#D9D0F5>This puts the lobby back to <white>how it was last saved</white> and reads hub-npcs.yml again. Anything changed since that save is undone. <#D9D0F5>To go ahead: <yellow>/regenlobby confirm</yellow><#D9D0F5>. For the lobby as it was uploaded: <yellow>/regenlobby original"
  regen-confirm-template: "<prefix><#D9D0F5>This rebuilds the lobby from the uploaded template (<white>plugins/FractalCTF/hub-template</white>) and reads hub-npcs.yml again. <red>Anything built by hand in the lobby is replaced.</red> <#D9D0F5>To go ahead: <yellow>/regenlobby confirm"
  regen-confirm-drop: "<prefix><#D9D0F5>This rebuilds the lobby from the uploaded template (<white>plugins/FractalCTF/hub-template</white>) and reads hub-npcs.yml again. <red>The lobby you saved with /savelobby is thrown away.</red> <#D9D0F5>To go ahead: add <yellow>confirm</yellow> to what you typed."
  regen-no-template: "<prefix><red>There is nothing to rebuild from. Upload the hub-template folder to plugins/FractalCTF/ first."
  regen-busy: "<prefix><red>The lobby is already being rebuilt."
  regen-start: "<prefix><#D9D0F5>Rebuilding the lobby. Hold on a moment..."
  regen-done: "<prefix><green>Lobby rebuilt.</green> <#D9D0F5>Blocks put back: <white><blocks></white><#D9D0F5>. Labels and stands replaced: <white><entities></white><#D9D0F5>."
