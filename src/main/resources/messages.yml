# ── End of a match (chat) ───────────────────────────────────────
# ── How the mode is played (shown when you arrive on the map) ──
# <limit> captures/points to win, <seconds> to capture a hill, <return> before a dropped flag goes home,
# <wool> wool to break, <minutes> the time limit.
intro:
  title: "<white><bold><mode>"
  map: "<#D9D0F5><map> <#9C8DC8>by <authors>"
  ctf:
    - "<#B58CFF>▸ <white>Grab the enemy's flag and bring it to yours."
    - "<#B58CFF>▸ <#D9D0F5>Your own flag must be <white>at base</white> to score."
    - "<#B58CFF>▸ <#D9D0F5>Die while carrying it and you <white>drop</white> it."
    - "<#B58CFF>▸ <#D9D0F5>Touch your dropped flag to send it home."
    - "<#B58CFF>▸ <#D9D0F5>Follow the <white>coloured beams</white> to find the flags."
    - "<gold>★ <green>First to <white><limit></white> captures wins."
  koth:
    - "<#B58CFF>▸ <white>Stand on a hill with no enemies to capture it."
    - "<#B58CFF>▸ <#D9D0F5>A hill you own scores <white>every second</white>."
    - "<#B58CFF>▸ <#D9D0F5>The middle hill scores <white>double</white>."
    - "<#B58CFF>▸ <#D9D0F5>More teammates on a hill capture it faster."
    - "<gold>★ <green>First to <white><limit></white> points wins."
  dtw:
    - "<#B58CFF>▸ <white>Break <wool> of the enemy's wool to knock them out."
    - "<#B58CFF>▸ <#D9D0F5>Guard your tower: you can't break your own wool."
    - "<#B58CFF>▸ <#D9D0F5>Breaking wool slows you for a few seconds."
    - "<gold>★ <green>The last team with wool wins."
  always:
    - "<#9C8DC8>Kits at the start · <yellow>/spawn</yellow> base · <yellow>/tc</yellow> team chat"

end:
  line: "<green><strikethrough>                                                                      "
  title: "<white><bold><mode>"
  map: "<#D9D0F5><map>"
  winner: "<white>Winner: <team> <#9C8DC8>- <white><score>"
  draw: "<yellow><bold>It's a draw!"
  top-none: "<#D9D0F5>Nobody got a kill or an objective."
  place-1: "<yellow><bold>1st</bold> <#9C8DC8>-</#9C8DC8> <player> <#9C8DC8>-</#9C8DC8> <white><kills> kills, <objectives> obj."
  place-2: "<gold><bold>2nd</bold> <#9C8DC8>-</#9C8DC8> <player> <#9C8DC8>-</#9C8DC8> <white><kills> kills, <objectives> obj."
  place-3: "<red><bold>3rd</bold> <#9C8DC8>-</#9C8DC8> <player> <#9C8DC8>-</#9C8DC8> <white><kills> kills, <objectives> obj."
  result-win: "<gold><bold>★ VICTORY ★"
  result-loss: "<red><bold>✖ DEFEAT ✖"
  result-draw: "<yellow><bold>DRAW"
  result-watched: "<aqua><bold>You watched this match"
  you: "<white><kills> <#D9D0F5>kills  <white><deaths> <#D9D0F5>deaths  <white><assists> <#D9D0F5>assists  <white><objectives> <#D9D0F5>objectives"
