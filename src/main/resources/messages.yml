  mirror-none: "<prefix><red>This map's bases aren't copies of each other, so there's nothing to mirror to."
  mirror-not-editing: "<prefix><red>Mirror mode only works while you edit a map: <white>/ctfmap edit <map>"
  help:
    - "<prefix><white>/ctfmap list</white> <#D9D0F5>| <white>info [map]</white> <#D9D0F5>| <white>reload"
    - "<prefix><white>/ctfmap import <world-folder> <id></white> <#D9D0F5>copy an uploaded world into the maps"
