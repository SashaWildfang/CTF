    assist: "Assists"
    capture: "Flag captures"
    wool: "Wool destroyed"
    hill: "Holding the hill"
    win: "Winning"
    play: "Playing"

# ── Chat and tab list ───────────────────────────────────────────
chat:
  # <rank> is the FractalRanks prefix; in a match <tag> is R/B/G/Y and <color> the team colour.
  name: "<rank><white><player>"
  name-team: "<color>[<tag>]</color> <rank><color><player>"
  format: "<name><dark_gray>:</dark_gray> <white><message>"
  team-format: "<color><bold>TEAM</bold></color> <name><dark_gray>:</dark_gray> <color><message>"
  join: "<dark_gray>[<green>+</green>]</dark_gray> <name>"
  quit: "<dark_gray>[<red>-</red>]</dark_gray> <name>"
  team-on: "<prefix><green>Team chat on.</green> <gray>Everything you type goes to your team. /tc to turn it off."
  team-off: "<prefix><gray>Team chat off."
  no-team: "<prefix><red>You're not on a team right now."

tab:
  hub-header: "\n<gradient:#FF5555:#5599FF><bold>FRACTAL CTF</bold></gradient>\n<gray>Waiting lobby <dark_gray>• <white><players></white> online\n"
  hub-footer: "\n<gray>/kit <dark_gray>•</dark_gray> /vote <dark_gray>•</dark_gray> /coins <dark_gray>•</dark_gray> /ctfstats\n<#9C8DB8>fractalsmp.net\n"
  game-header: "\n<gradient:#FF5555:#5599FF><bold>FRACTAL CTF</bold></gradient>\n<white><mode></white> <dark_gray>on</dark_gray> <white><map>\n"
  game-footer: "\n<score>\n<gray>/t team chat <dark_gray>•</dark_gray> /kit <dark_gray>•</dark_gray> /leave\n<#9C8DB8>fractalsmp.net\n"

