npcs:
  - {id: armourer, name: "<gold><bold>Armourer", role: kits, profession: weaponsmith, type: plains, x: 95.5, y: 69, z: -7.5, yaw: 90, lines: ["Every kit's on a stand: <yellow>right-click</yellow> to look, <yellow>left-click</yellow> to equip.", "Earn coins in matches, then come back and unlock something new.", "The Tank can take a beating. The Ninja can take a flag."]}
  - {id: astronomer, name: "<aqua><bold>Astronomer", role: spectate, profession: cartographer, type: snow, x: -6.5, y: 71, z: -79.5, yaw: 180, lines: ["From up here you can see every island. Want to watch the match?", "I'll send you over as a spectator. Nobody will see you, promise."]}
  - {id: map-scout, name: "<yellow><bold>Map Scout", role: vote, profession: cartographer, type: plains, x: -0.5, y: 71, z: -79.5, yaw: 180, lines: ["Ten islands charted so far. Which one next? Cast your vote.", "Small maps are quick and bloody. The big ones need bridges and patience."]}
  - {id: innkeeper, name: "<gold>Innkeeper Bram", role: talk, profession: butcher, type: plains, x: -91.5, y: 67, z: -2.5, yaw: 0, lines: ["Welcome to the Broken Flagpole! Named after the last match I played.", "The Tank kit? Wears a diamond chestplate to dinner. Every time.", "Heard someone took a flag across Frostfall without placing a single block. Heard wrong, probably."]}
  - {id: chronicler, name: "<aqua><bold>Chronicler", role: stats, profession: librarian, type: plains, x: -84.5, y: 67, z: 6.5, yaw: 180, lines: ["I write down every kill, capture and win. Let me show you yours.", "The leaderboards are in my book too. Top ten, every stat."]}
  - {id: bard, name: "<light_purple>Bard", role: talk, profession: cleric, type: plains, x: -94.5, y: 67, z: 6.5, yaw: 90, lines: ["♪ Oh the wool it was red, and the tower stood tall... ♪", "I'd write a song about your last match, but I only know sad tunes.", "Sing with me! No? Rate a map then: <yellow>/rate 1-5</yellow>."]}
  - {id: red-captain, name: "<red><bold>Captain Rhea", role: kits, profession: weaponsmith, type: savanna, x: -53.5, y: 63, z: 76.5, yaw: 180, lines: ["Pick your kit before the horn sounds. Grab the <yellow>book</yellow> any time.", "Defenders win games. Somebody has to stay home.", "Bridge fast, bridge wide, and never bridge alone."]}
  - {id: red-quartermaster, name: "<red>Quartermaster", role: kits, profession: armorer, type: plains, x: -58.5, y: 63, z: 74.5, yaw: 135, lines: ["Golden apples for every kill, but eat them slowly: there's a cooldown.", "Out of blocks? Break the map: everything but spawns and objectives breaks."]}
  - {id: red-scout, name: "<red>Scout", role: join, profession: cartographer, type: plains, x: -49.5, y: 63, z: 63.5, yaw: 180, lines: ["A match is on? Talk to me and I'll get you in.", "Long shots count double in my book. Not in the scoreboard, though."]}
  - {id: red-recruit, name: "<red>Recruit", role: talk, profession: none, type: plains, x: -46.5, y: 63, z: 69.5, yaw: 90, lines: ["I've hit that dummy a hundred times. It's winning.", "They say the wool towers fall faster than they look.", "Did you know you can rate maps? <yellow>/rate 1-5</yellow> after a match."]}
  - {id: blue-captain, name: "<blue><bold>Captain Corin", role: kits, profession: weaponsmith, type: taiga, x: 56.5, y: 63, z: 76.5, yaw: 180, lines: ["Pick your kit before the horn sounds. Grab the <yellow>book</yellow> any time.", "Defenders win games. Somebody has to stay home.", "Bridge fast, bridge wide, and never bridge alone."]}
